<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 950" width="1320" height="950" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>米田引理全局交换图</title>
  <desc>Nat(Hom(C,−), F) 与 F(C) 的对应：自然变换的分量构成交换方块，元素 x = η_C(id_C) 经 corner 构造唯一决定 η。</desc>

  <defs>
    <marker id="ahN" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="ahB" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ahG" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#15803d"/></marker>
    <marker id="ahE" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="ahR" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <style>
      .ttl{font-size:23px;font-weight:800;fill:#1b1f27}
      .sub{font-size:14px;fill:#4d5461}
      .ctitle{font-size:15px;font-weight:750;fill:#1b1f27}
      .zone{fill:#fbfcfe;stroke:#dbe3ee;stroke-width:1.6}
      .zoneC{fill:#f4f7ff;stroke:#2563eb;stroke-width:1.6;stroke-dasharray:6 5}
      .zoneS{fill:#fafdfb;stroke:#15803d;stroke-width:1.6}
      .zoneY{fill:#fbf8ff;stroke:#7c3aed;stroke-width:1.6}
      .nodeB{fill:#eef4ff;stroke:#2563eb;stroke-width:1.6}
      .nodeG{fill:#eefaf1;stroke:#15803d;stroke-width:1.6}
      .nodeR{fill:#fef2f2;stroke:#dc2626;stroke-width:1.8}
      .nodeY{fill:#f6f1ff;stroke:#7c3aed;stroke-width:1.6}
      .nt{font-size:14px;font-weight:650;fill:#1b1f27}
      .ntb{font-size:14px;font-weight:700;fill:#1d4ed8}
      .ntg{font-size:14px;font-weight:700;fill:#15803d}
      .ntr{font-size:13px;font-weight:750;fill:#b91c1c}
      .lb{font-size:13px;fill:#334155}
      .lbb{font-size:12.5px;font-weight:650;fill:#1d4ed8}
      .lbg{font-size:12.5px;font-weight:650;fill:#15803d}
      .lbe{font-size:12.5px;font-weight:650;fill:#6d28d9}
      .lbr{font-size:12.5px;font-weight:650;fill:#b91c1c}
      .tiny{font-size:11px;fill:#64748b}
      .eq{font-size:11.5px;font-weight:650;fill:#92400e}
      .arN{stroke:#475569;stroke-width:1.7;fill:none;marker-end:url(#ahN)}
      .arB{stroke:#2563eb;stroke-width:1.9;fill:none;marker-end:url(#ahB)}
      .arG{stroke:#15803d;stroke-width:1.9;fill:none;marker-end:url(#ahG)}
      .arE{stroke:#7c3aed;stroke-width:2;fill:none;marker-end:url(#ahE)}
      .arR{stroke:#dc2626;stroke-width:2;fill:none;marker-end:url(#ahR);marker-start:url(#ahR)}
      .dash{stroke-dasharray:5 4}
      .sq{fill:#fbbf24;stroke:#d97706;stroke-width:1.3}
      .sq2{fill:none;stroke:#d97706;stroke-width:1.3;stroke-dasharray:6 4}
      .step{opacity:0;animation:ap .55s ease forwards}
      @keyframes ap{to{opacity:1}}
      .s1{animation-delay:.3s}.s2{animation-delay:1.1s}.s3{animation-delay:1.9s}
      .s4{animation-delay:2.7s}.s5{animation-delay:3.5s}.s6{animation-delay:4.3s}
      .s7{animation-delay:5.1s}.s8{animation-delay:5.9s}.s9{animation-delay:6.7s}
      .s10{animation-delay:7.5s}
      .p1{animation:pl 2.4s ease-in-out 8.3s infinite}
      .p2{animation:pl 2.4s ease-in-out 9.1s infinite}
      .p3{animation:pl 2.4s ease-in-out 9.9s infinite}
      @keyframes pl{0%,100%{opacity:.10}50%{opacity:.5}}
    </style>
  </defs>

  <!-- ===== 标题 ===== -->
  <g class="step s1">
    <text class="ttl" x="660" y="40" text-anchor="middle">米田引理 · 全局交换图</text>
    <text class="sub" x="660" y="66" text-anchor="middle">Nat(Hom(C,−), F) ≅ F(C)　—　一个自然变换 η 由单个元素 x = η_C(id_C) 唯一决定</text>
  </g>

  <!-- ===== 范畴 C ===== -->
  <g class="step s1">
    <ellipse class="zoneC" cx="170" cy="450" rx="132" ry="300"/>
    <text class="ctitle" x="170" y="180" text-anchor="middle">范畴 C</text>
    <text class="tiny" x="170" y="198" text-anchor="middle">源范畴（局部小）</text>
  </g>
  <g class="step s1">
    <rect class="nodeB" x="118" y="246" width="104" height="44" rx="9"/>
    <text class="ntb" x="170" y="274" text-anchor="middle">C</text>
    <rect class="nodeB" x="118" y="418" width="104" height="44" rx="9"/>
    <text class="ntb" x="170" y="446" text-anchor="middle">C′</text>
    <rect class="nodeB" x="118" y="590" width="104" height="44" rx="9"/>
    <text class="ntb" x="170" y="618" text-anchor="middle">C″</text>
  </g>
  <g class="step s2">
    <line class="arN" x1="158" y1="290" x2="158" y2="416"/>
    <text class="lb" x="146" y="356" text-anchor="end">f</text>
    <line class="arN" x1="158" y1="462" x2="158" y2="588"/>
    <text class="lb" x="146" y="528" text-anchor="end">g</text>
    <path class="arN dash" d="M 222,272 Q 292,450 222,612"/>
    <text class="lb" x="262" y="450">g∘f</text>
    <text class="tiny" x="170" y="700" text-anchor="middle">f:C→C′, g:C′→C″, g∘f:C→C″</text>
  </g>

  <!-- ===== Sets 容器 ===== -->
  <g class="step s3">
    <rect class="zoneS" x="336" y="212" width="594" height="660" rx="22"/>
    <text class="ctitle" x="633" y="244" text-anchor="middle">Set（集合范畴）</text>
    <text class="tiny" x="485" y="272" text-anchor="middle">hom 函子 H = Hom(C,−)</text>
    <text class="tiny" x="815" y="272" text-anchor="middle">函子 F : C → Set</text>
  </g>

  <!-- ===== 交换方块底纹（最后脉冲演示）===== -->
  <g class="step s10">
    <rect class="sq p1" x="576" y="300" width="158" height="122" rx="8"/>
    <rect class="sq p2" x="576" y="460" width="158" height="122" rx="8"/>
    <rect class="sq2 p3" x="576" y="300" width="158" height="282" rx="8" fill="none"/>
  </g>

  <!-- ===== hom 列对象 ===== -->
  <g class="step s3">
    <rect class="nodeB" x="402" y="300" width="168" height="46" rx="8"/>
    <text class="ntb" x="486" y="329" text-anchor="middle">Hom(C, C)</text>
    <rect class="nodeB" x="402" y="460" width="168" height="46" rx="8"/>
    <text class="ntb" x="486" y="489" text-anchor="middle">Hom(C, C′)</text>
    <rect class="nodeB" x="402" y="620" width="168" height="46" rx="8"/>
    <text class="ntb" x="486" y="649" text-anchor="middle">Hom(C, C″)</text>
  </g>

  <!-- ===== F 列对象 ===== -->
  <g class="step s4">
    <rect class="nodeG" x="744" y="300" width="168" height="46" rx="8"/>
    <text class="ntg" x="828" y="329" text-anchor="middle">F(C)</text>
    <rect class="nodeG" x="744" y="460" width="168" height="46" rx="8"/>
    <text class="ntg" x="828" y="489" text-anchor="middle">F(C′)</text>
    <rect class="nodeG" x="744" y="620" width="168" height="46" rx="8"/>
    <text class="ntg" x="828" y="649" text-anchor="middle">F(C″)</text>
  </g>

  <!-- ===== hom 函子作用（蓝，竖直）===== -->
  <g class="step s5">
    <line class="arB" x1="486" y1="346" x2="486" y2="458"/>
    <text class="lbb" x="478" y="404" text-anchor="end">H(f)=e(C,f)</text>
    <line class="arB" x1="486" y1="506" x2="486" y2="618"/>
    <text class="lbb" x="478" y="564" text-anchor="end">H(g)=e(C,g)</text>
    <path class="arB dash" d="M 568,323 Q 636,450 568,643"/>
    <text class="lbb" x="640" y="455">H(g∘f)</text>
  </g>

  <!-- ===== F 的箭头（绿，竖直）===== -->
  <g class="step s6">
    <line class="arG" x1="828" y1="346" x2="828" y2="458"/>
    <text class="lbg" x="838" y="404">F(f)</text>
    <line class="arG" x1="828" y1="506" x2="828" y2="618"/>
    <text class="lbg" x="838" y="564">F(g)</text>
    <path class="arG dash" d="M 910,323 Q 940,450 910,643"/>
    <text class="lbg" x="928" y="455" text-anchor="end">F(g∘f)</text>
  </g>

  <!-- ===== 自然变换 η 的分量（紫，水平）===== -->
  <g class="step s7">
    <line class="arE" x1="572" y1="323" x2="742" y2="323"/>
    <text class="lbe" x="657" y="313" text-anchor="middle">η<tspan baseline-shift="sub" font-size="10">C</tspan></text>
    <line class="arE" x1="572" y1="483" x2="742" y2="483"/>
    <text class="lbe" x="657" y="473" text-anchor="middle">η<tspan baseline-shift="sub" font-size="10">C′</tspan></text>
    <line class="arE" x1="572" y1="643" x2="742" y2="643"/>
    <text class="lbe" x="657" y="633" text-anchor="middle">η<tspan baseline-shift="sub" font-size="10">C″</tspan></text>
    <text class="lbe" x="470" y="234">η : Hom(C,−) ⇒ F（自然变换）</text>
  </g>

  <!-- ===== 交换方块上的等式（第 9 步）===== -->
  <g class="step s9">
    <text class="eq" x="655" y="360" text-anchor="middle">η<tspan baseline-shift="sub" font-size="9">C′</tspan>∘H(f) = F(f)∘η<tspan baseline-shift="sub" font-size="9">C</tspan></text>
    <text class="eq" x="655" y="520" text-anchor="middle">η<tspan baseline-shift="sub" font-size="9">C″</tspan>∘H(g) = F(g)∘η<tspan baseline-shift="sub" font-size="9">C′</tspan></text>
  </g>

  <!-- ===== 关键元素 id_C 与 x（红，第 8 步）===== -->
  <g class="step s8">
    <circle cx="424" cy="323" r="6" fill="#dc2626"/>
    <text class="lbr" x="410" y="327" text-anchor="end">id<tspan baseline-shift="sub" font-size="9">C</tspan> ∈</text>
    <circle cx="766" cy="323" r="6" fill="#dc2626"/>
    <text class="ntr" x="828" y="360" text-anchor="middle">x = η<tspan baseline-shift="sub" font-size="10">C</tspan>(id<tspan baseline-shift="sub" font-size="10">C</tspan>)</text>
    <text class="tiny" x="828" y="378" text-anchor="middle">（米田对应选出的元素）</text>
  </g>

  <!-- ===== 米田对应区 ===== -->
  <g class="step s9">
    <rect class="zoneY" x="950" y="212" width="336" height="660" rx="20"/>
    <text class="ctitle" x="1118" y="244" text-anchor="middle" fill="#6d28d9">米田对应 (Yoneda)</text>
    <rect class="nodeY" x="985" y="290" width="266" height="52" rx="9"/>
    <text class="nt" x="1118" y="321" text-anchor="middle" font-size="12.5">Nat(Hom(C,−), F)</text>
    <rect class="nodeR" x="985" y="470" width="266" height="52" rx="9"/>
    <text class="ntr" x="1118" y="501" text-anchor="middle">F(C) ∋ x</text>
    <line class="arR" x1="1052" y1="344" x2="1052" y2="468"/>
    <line class="arR" x1="1184" y1="344" x2="1184" y2="468"/>
    <text class="lbr" x="1044" y="410" text-anchor="end">Φ</text>
    <text class="tiny" x="1044" y="428" text-anchor="end">η ↦ η<tspan baseline-shift="sub" font-size="9">C</tspan>(id)</text>
    <text class="lbr" x="1192" y="410">Ψ</text>
    <text class="tiny" x="1192" y="428">x ↦ η<sup>x</sup></text>
    <text class="lbe" x="1118" y="452" text-anchor="middle" font-size="12">双射 ≅，且对 A、F 自然</text>
  </g>
  <g class="step s10">
    <rect class="nodeY" x="978" y="562" width="280" height="104" rx="10"/>
    <text class="lbe" x="1118" y="588" text-anchor="middle">corner 构造（Mac Lane）</text>
    <text class="eq" x="1118" y="616" text-anchor="middle" font-size="13">η<tspan baseline-shift="super" font-size="9">x</tspan><tspan baseline-shift="sub" font-size="10">B</tspan>(f) = F(f)(x)</text>
    <text class="tiny" x="1118" y="642" text-anchor="middle">f : C→B 处于 Hom(C,B) 的“角”</text>
    <rect class="nodeB" x="978" y="690" width="280" height="150" rx="10"/>
    <text class="lbb" x="1118" y="716" text-anchor="middle">unit 嵌入（Yoneda 嵌入）</text>
    <text class="lb" x="996" y="744">y : A ↦ Hom(−,A)</text>
    <text class="tiny" x="996" y="766">米田引理给出 y 满忠实：</text>
    <text class="tiny" x="996" y="786">Nat(Hom(−,A),Hom(−,B)) ≅ Hom(A,B)</text>
    <text class="tiny" x="996" y="812">取 F = Hom(−,B) 即得，</text>
    <text class="tiny" x="996" y="832">对应箭头 f ↦ f∘(−)。</text>
  </g>

  <!-- ===== 图例 ===== -->
  <g class="step s10">
    <line x1="372" y1="912" x2="404" y2="912" stroke="#2563eb" stroke-width="2.4"/>
    <text class="tiny" x="410" y="916">hom 函子 Hom(C,−) 的像与态射</text>
    <line x1="640" y1="912" x2="672" y2="912" stroke="#15803d" stroke-width="2.4"/>
    <text class="tiny" x="678" y="916">函子 F 的像与态射</text>
    <line x1="852" y1="912" x2="884" y2="912" stroke="#7c3aed" stroke-width="2.4"/>
    <text class="tiny" x="890" y="916">η 的分量</text>
    <circle cx="1064" cy="912" r="5" fill="#dc2626"/>
    <text class="tiny" x="1074" y="916">关键元素 id、x</text>
  </g>
</svg>
